name: Daten aktualisieren

on:
  schedule:
    - cron: "17 3 * * 1"   # montags 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten neu bauen
        run: python3 -u scripts/build_data.py
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sites.json
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "Daten aktualisiert ($(date -u +%F))"
          git push
